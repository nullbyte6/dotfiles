[cursor]
style = "Block"
unfocused_hollow = true
thickness = 0.15

[env]
TERM = "alacritty"

[font]
size = 14.0

[font.normal]
family = "monospace"
style = "Regular"

[font.bold]
family = "monospace"
style = "Bold"

[font.italic]
family = "monospace"
style = "Italic"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"


[[hints.enabled]]
binding = { key = "U", mods = "Control|Shift" }
command = "xdg-open"
post_processing = true
mouse = { enabled = true }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|nntp:|sip:|sips:|sftp://|ssh:|git://|git\\+ssh://|svn://|work-tree://)([^\\u0000-\\u001F\\u007F-\\u009F()<>{}\\[\\]\\\\]+[^\\u0000-\\u001F\\u007F-\\u009F()<>{}\\[\\]\\\\\\)\\)])"

[[hints.enabled]]
binding = { key = "L", mods = "Control|Shift" }
command = "xdg-open"
post_processing = true
mouse = { enabled = true }
regex = "(?:(?:[1-9]\\d?|1\\d{2}|2[0-4]\\d|25[0-5])\\.){3}(?:[1-9]\\d?|1\\d{2}|2[0-4]\\d|25[0-5])|(?:(?:[a-z\\u00a1-\\uffff0-9]+-)*[a-z\\u00a1-\\uffff0-9]+)(?:\\.(?:[a-z\\u00a1-\\uffff0-9]+-)*[a-z\\u00a1-\\uffff0-9]+)*(?:\\.(?:[a-z\\u00a1-\\uffff]{2,}))"

[bell]
animation = "EaseOutExpo"
duration = 0
visual = false

[colors]
theme = "Catppuccin Macchiato"

[colors.primary]
background = "#24273A"
foreground = "#CAD3F4"

[colors.cursor]
text = "#24273A"
cursor = "#F4DBD6"

[colors.vi_mode_cursor]
text = "#24273A"
cursor = "#F4DBD6"

[colors.search.matches]
background = "#A6DA95"
foreground = "#24273A"

[colors.search.focused_match]
background = "#EED49F"
foreground = "#24273A"

[colors.keyboard.hints]
start = "#EED49F"
end = "#A6DA95"

[colors.hints.start]
background = "#EED49F"
foreground = "#24273A"

[colors.hints.end]
background = "#A6DA95"
foreground = "#24273A"

[colors.line_indicator]
background = "none"
foreground = "none"

[colors.footer_bar]
background = "#1E2030"
foreground = "#CAD3F4"

[colors.normal]
black = "#494D64"
red = "#ED8796"
green = "#A6DA95"
yellow = "#EED49F"
blue = "#8AADF4"
magenta = "#F5BDE6"
cyan = "#8BD5CA"
